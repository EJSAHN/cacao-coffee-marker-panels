[project]
name = "cacao-coffee-marker-panels"
version = "1.0.0"
description = "Reproducible pipeline for identity-aware genomic prediction and low-density SNP panel evaluation in public cacao and coffee breeding datasets."
requires-python = ">=3.10"
dependencies = [
  "pandas",
  "numpy",
  "scipy",
  "scikit-learn",
  "statsmodels",
  "openpyxl",
  "xlrd",
  "pyarrow",
  "pyyaml"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
