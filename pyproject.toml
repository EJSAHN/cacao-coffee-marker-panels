[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cacao-coffee-marker-panels"
version = "2.0.0rc1"
description = "Genomic prediction and marker-panel evaluation with explicit validation designs"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "scipy>=1.10,<2", "pandas>=2,<4", "scikit-learn>=1.7,<2", "openpyxl>=3.1,<4", "xlrd>=2,<3"]

[project.scripts]
cacao-coffee-panels = "cacao_coffee_panels.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
